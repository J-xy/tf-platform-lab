name: terraform

# Runs on every PR, and on main after merge so a broken merge is caught even if
# the PR was opened before the offending change landed.
on:
  pull_request:
  push:
    branches: [main]

# Workflow default: read-only checkout, no OIDC token. Jobs that assume an AWS
# role declare id-token: write themselves.
permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.15.8"
  AWS_REGION: us-east-1
  # Set by the ci/ stack. Output: ci_role_arn
  AWS_ROLE_ARN: arn:aws:iam::964291633585:role/github-actions-terraform-plan

jobs:
  # Formatting needs no credentials, so it runs on its own and fails in seconds
  # rather than after a role assumption that was never necessary.
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  # Linting and policy scanning. Like fmt, this needs no AWS credentials — the
  # scanners read HCL, not live infrastructure — so it runs in parallel with
  # plan rather than behind a role assumption it does not need.
  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: v0.64.0

      # The AWS ruleset is downloaded from GitHub; the token avoids being rate
      # limited on shared runners.
      - name: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: tflint
        run: tflint --recursive --format compact

      # Suppressions live in .trivyignore.yaml, each with a written
      # justification. A finding without a defensible reason gets fixed
      # instead of listed there.
      # trivyignores, NOT ignore-file — the action has no input by that name and
      # would silently scan with no suppressions at all.
      - name: trivy config
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "1"

  # Module tests use mock_provider and command = plan, so they never touch AWS.
  # No id-token, no role: the same reasoning as fmt.
  test:
    name: terraform test (baseline-vpc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        working-directory: modules/baseline-vpc
        run: terraform init -backend=false -input=false -no-color

      - name: terraform test
        working-directory: modules/baseline-vpc
        run: terraform test -no-color

  plan:
    name: plan (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: fmt
    # id-token: write is REQUIRED to mint the OIDC token. Without it the AWS
    # step fails with "Credentials could not be loaded", which reads like a role
    # problem and is actually a permissions block.
    permissions:
      id-token: write
      contents: read
    strategy:
      # One failing stack should not hide the others' results.
      fail-fast: false
      matrix:
        stack: [bootstrap, network, ci]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # Exchanges the run's OIDC token for role credentials. No stored secrets:
      # nothing here reads from GitHub secrets at all.
      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ matrix.stack }}
        run: terraform init -input=false -no-color

      - name: terraform validate
        working-directory: ${{ matrix.stack }}
        run: terraform validate -no-color

      # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
      # A plan showing drift is information, not failure, so 2 is tolerated here
      # and surfaced in the summary instead.
      - name: terraform plan
        id: plan
        working-directory: ${{ matrix.stack }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=60s -detailed-exitcode > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt
          exit $([ $code -eq 1 ] && echo 1 || echo 0)

      - name: Summarise plan
        if: always()
        working-directory: ${{ matrix.stack }}
        run: |
          {
            case "${{ steps.plan.outputs.exitcode }}" in
              0) echo "### \`${{ matrix.stack }}\` — no changes" ;;
              2) echo "### \`${{ matrix.stack }}\` — changes detected" ;;
              *) echo "### \`${{ matrix.stack }}\` — plan failed" ;;
            esac
            echo
            echo '```terraform'
            tail -c 60000 plan.txt || echo "(no plan output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Apply runs only after merge, and only once a reviewer approves the prod
  # environment. `environment: prod` is what changes the OIDC subject to
  # :environment:prod — the only subject the apply role trusts, and one the
  # plan role never accepts.
  apply:
    name: apply (${{ matrix.stack }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [plan, policy, test]
    environment: prod
    permissions:
      id-token: write
      contents: read
    # Own group, never cancelled. The workflow-level group cancels in-progress
    # runs, which would kill an apply half-way and leave state locked.
    concurrency:
      group: terraform-apply
      cancel-in-progress: false
    strategy:
      # One stack at a time, in dependency order: bootstrap holds the others'
      # state, so a failure there should stop the rest.
      max-parallel: 1
      fail-fast: true
      matrix:
        stack: [bootstrap, network, ci]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Assume AWS apply role via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          # ci/ output: ci_apply_role_arn. Not the plan role.
          role-to-assume: arn:aws:iam::964291633585:role/github-actions-terraform-apply
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ matrix.stack }}
        run: terraform init -input=false -no-color

      - name: terraform apply
        working-directory: ${{ matrix.stack }}
        run: terraform apply -input=false -no-color -lock-timeout=120s -auto-approve
